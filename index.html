<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجوهرات بوفضل | BOFADEL</title>
<meta name="description" content="مجوهرات بوفضل، منذ عام 1989. تابعونا على صفحاتنا.">
<meta name="theme-color" content="#3a060c">
<meta property="og:title" content="مجوهرات بوفضل | BOFADEL">
<meta property="og:description" content="منذ عام 1989. تابعونا على صفحاتنا.">
<meta property="og:image" content="assets/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #3a060c;
    --deep: #1c0205;
    --gold: #e2c575;
    --gold-hi: #f6e6b4;
    --gold-lo: #a9792f;
    --cream: #faf3e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--deep); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Tajawal', system-ui, sans-serif;
    color: var(--cream);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(28, 2, 5, .15), rgba(28, 2, 5, .65) 75%),
      url('assets/bg.jpg') center / cover no-repeat fixed,
      var(--maroon);
    display: flex; justify-content: center; align-items: flex-start;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  /* iOS ignores fixed backgrounds: a plain cover there */
  @supports (-webkit-touch-callout: none) { body { background-attachment: scroll; } }

  .card {
    position: relative; width: 100%; max-width: 440px;
    padding: 44px 26px 30px;
    border-radius: 22px;
    background: rgba(30, 3, 7, .42);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    animation: rise .9s ease-out both;
  }
  /* the gold double rule: an outer hairline and a finer inner one. Plain borders, not masks: mask-composite is
     missing on some phone browsers and the lines vanished there. Light from the upper left: the top and left
     edges in the light gold, the bottom and right in the deep one. */
  .card::before, .card::after {
    content: ''; position: absolute; pointer-events: none; border-radius: 22px;
    border: 1.5px solid; border-color: #f1d996 #a9792f #a9792f #f1d996;
  }
  .card::before { inset: 0; }
  .card::after { inset: 7px; border-width: 1px; border-radius: 16px; opacity: .55; }

  .logo { display: block; width: 78%; max-width: 300px; height: auto; margin: 0 auto; filter: drop-shadow(0 4px 8px rgba(20, 2, 4, .6)); }
  .since {
    text-align: center; margin-top: 16px; font-weight: 700; font-size: 18px; letter-spacing: .5px;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 22px auto 26px; width: 82%; }
  .divider i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold) 70%); }
  .divider i:last-child { background: linear-gradient(270deg, transparent, var(--gold) 70%); }
  .divider b { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); }
  .divider b.s { width: 4px; height: 4px; opacity: .8; }

  .links { list-style: none; display: grid; gap: 14px; }
  .links a {
    position: relative; display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 10px 16px;
    border-radius: 14px; text-decoration: none; color: var(--cream);
    background: linear-gradient(180deg, rgba(90, 10, 20, .55), rgba(40, 4, 9, .62));
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .links a::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 14px;
    border: 1px solid; border-color: #f1d996 #b8893a #a9792f #e2c575; opacity: .9;
  }
  .links a:hover, .links a:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, .4), 0 0 18px rgba(226, 197, 117, .18);
    background: linear-gradient(180deg, rgba(110, 14, 26, .65), rgba(48, 5, 11, .7));
    outline: none;
  }
  .ico {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fbefc6, #d9b062 55%, #9c6d26);
    box-shadow: inset 0 -2px 4px rgba(80, 40, 0, .35), 0 2px 6px rgba(0, 0, 0, .35);
  }
  .ico svg { width: 21px; height: 21px; fill: #4a0810; }
  .ico svg.stroke { fill: none; stroke: #4a0810; stroke-width: 1.7; }
  .label { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
  .label strong { font-size: 17px; font-weight: 700; }
  .label small { font-size: 12px; color: rgba(250, 243, 228, .62); letter-spacing: .4px; direction: ltr; text-align: right; }
  .arrow { flex: none; width: 18px; height: 18px; stroke: var(--gold); fill: none; stroke-width: 2; opacity: .8; }

  .soon { text-align: center; color: rgba(250, 243, 228, .75); font-size: 15px; padding: 10px 0 4px; }
  footer { margin-top: 30px; text-align: center; font-size: 12.5px; color: rgba(250, 243, 228, .55); line-height: 1.8; }
  footer span { color: var(--gold); }

  .links li { animation: rise .7s ease-out both; }
  .links li:nth-child(1) { animation-delay: .15s; } .links li:nth-child(2) { animation-delay: .23s; }
  .links li:nth-child(3) { animation-delay: .31s; } .links li:nth-child(4) { animation-delay: .39s; }
  .links li:nth-child(5) { animation-delay: .47s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .links li { animation: none; } .links a { transition: none; } }
  @media (max-width: 360px) { .card { padding: 36px 18px 24px; } .label strong { font-size: 16px; } }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo.png" alt="مجوهرات بوفضل BOFADEL For Jewelry" width="600" height="321">
  <p class="since">منذ عام 1989</p>
  <div class="divider" aria-hidden="true"><i></i><b class="s"></b><b></b><b class="s"></b><i></i></div>
  <ul class="links" id="links"></ul>
  <p class="soon" id="soon" hidden>روابط صفحاتنا قريبًا</p>
  <footer>مجوهرات <span>بوفضل</span> · طبرق، ليبيا<br>&copy; <span id="year"></span> BOFADEL For Jewelry</footer>
</main>

<script>

  const ICONS = {

    facebook: '<svg viewBox="0 0 24 24"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.00     snapchat: '<svg viewBox="0 0 24 24"><path d="M12.206.793c.99 0 4.347.276 5.93 3.821.529 1.193.403 3.219.299 4.847l-.003.06c-.012.18-.022.345-.03.51.075.045.203.09.401.09.3-.016.659-.12 1.033-.301.165-.088.344-.104.464-.104.182 0 .359.029.509.09.45.149.734.479.734.838.015.449-.39.839-1.213 1.168-.089.029-.209.075-.344.119-.45.135-1.139.36-1.333.81-.09.224-.061.524.12.868l.015.015c.06.136 1.526 3.475 4.791 4.014.255.044.435.27.42.509 0 .075-.015.149-.045.225-.24.569-1.273.988-3.146 1.271-.059.091-.12.375-.164.57-.029.179-.074.36-.134.553-.076.271-.27.405-.555.405h-.03c-.135 0-.313-.031-.538-.074-.36-.075-.765-.135-1.273-.135-.3 0-.599.015-.913.074-.6.104-1.123.464-1.723.884-.853.599-1.826 1.288-3.294 1.288-.06 0-.119-.015-.18-.015h-.149c-1.468 0-2.427-.675-3.279-1.288-.599-.42-1.107-.779-1.707-.884-.314-.045-.629-.074-.928-.074-.54 0-.958.089-1.272.149-.211.043-.391.074-.54.074-.374 0-.523-.224-.583-.42-.061-.192-.09-.389-.135-.567-.046-.181-.105-.494-.166-.57-1.918-.222-2.95-.642-3.189-1.226-.031-.063-.052-.15-.055-.225-.015-.243.165-.465.42-.509 3.264-.54 4.73-3.879 4.791-4.02l.016-.029c.18-.345.224-.645.119-.869-.195-.434-.884-.658-1.332-.809-.121-.029-.24-.074-.346-.119-1.107-.435-1.257-.93-1.197-1.273.09-.479.674-.793 1.168-.793.146 0 .27.029.383.074.42.194.789.3 1.104.3.234 0 .384-.06.465-.105l-.046-.569c-.098-1.626-.225-3.651.307-4.837C7.392 1.077 10.739.807 11.727.807l.419-.015h.06z"/></svg>'
  };
  const ORDER = [
    ['website', 'الموقع الإلكتروني', 'Website'],
    ['whatsapp', 'واتساب', 'WhatsApp'],
    ['instagram', 'إنستغرام', 'Instagram'],
    ['facebook', 'فيسبوك', 'Facebook'],
    ['snapchat', 'سناب شات', 'Snapchat']
  ];
  const ARROW = '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  // Only web links leave the page; a bare WhatsApp number becomes its wa.me link.
  function safeUrl(key, v) {
    v = (v || '').trim();
    if (!v) return '';
    if (key === 'whatsapp' && /^[+\d\s()-]{6,}$/.test(v)) return 'https://wa.me/' + v.replace(/\D/g, '');
    try { const u = new URL(v); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : ''; }
    catch (e) { return ''; }
  }

  function render(data) {
    const ul = document.getElementById('links');
    ul.textContent = '';
    let shown = 0;
    for (const [key, ar, en] of ORDER) {
      const href = safeUrl(key, data[key]);
      if (!href) continue;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span class="ico">' + ICONS[key] + '</span><span class="label"><strong></strong><small></small></span>' + ARROW;
      a.querySelector('strong').textContent = ar;
      a.querySelector('small').textContent = en;
      li.appendChild(a); ul.appendChild(li); shown++;
    }
    document.getElementById('soon').hidden = shown > 0;
  }

  document.getElementById('year').textContent = new Date().getFullYear();
  fetch('links.json?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : {})
    .then(render)
    .catch(() => render({}));
</script>
</body>
</html>
